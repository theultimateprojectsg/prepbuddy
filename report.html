<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>PrepBuddy weekly report</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1E2A5A">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#F4F6FA;color:#1E2A5A;font-family:Lexend,system-ui,-apple-system,'PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif}
.wrap{max-width:1180px;margin:0 auto;min-height:100vh}
@media (min-width:900px){body{padding:24px}.wrap{border-radius:22px;overflow:hidden;background:#F4F6FA;box-shadow:0 1px 3px rgba(30,42,90,.08),0 12px 40px rgba(30,42,90,.08);min-height:0}}
@media print{body{padding:0}.wrap{box-shadow:none}.cta{display:none}}
.cta{margin:4px 20px 28px;padding:16px;border-radius:14px;background:#fff;border:1px solid #E3E6EA;font-size:14px;line-height:1.5;color:#374151}
.cta a{color:#26357A;font-weight:600}
@media (min-width:900px){.cta{margin:0 40px 36px}}
.err{padding:40px 20px;line-height:1.6}
</style>
<style id="rep-css"></style>
</head>
<body>
<div class="wrap" id="report"><p class="err">Loading report…</p></div>
<script type="module">
import { decodeReport, reportHTML, REPORT_CSS, headline } from './js/report.js';
document.getElementById('rep-css').textContent = REPORT_CSS;
const el = document.getElementById('report');
try {
  const data = new URLSearchParams(location.hash.slice(1)).get('d');
  if (!data) throw new Error('no data');
  const r = decodeReport(data);
  const zh = r.u === 'zh';
  if (zh) document.documentElement.lang = 'zh-HK';
  document.title = headline(r) + ' · PrepBuddy';
  el.innerHTML = reportHTML(r) + (zh ? '<div class="cta">PrepBuddy 把你子女自己的課本變成應試練習，並由 AI 批改。<a href="./">了解更多</a></div>' : '<div class="cta">PrepBuddy turns your child’s own textbook into exam practice with AI marking. <a href="./">Learn more</a></div>');
} catch (e) {
  const zhPhone = /^zh/i.test(navigator.language || '');
  el.innerHTML = zhPhone ? '<p class="err">這個報告連結不完整。請從 PrepBuddy 再傳送一次報告。</p>' : '<p class="err">This report link looks incomplete. Ask for the report to be sent again from PrepBuddy.</p>';
}
</script>
</body>
</html>
