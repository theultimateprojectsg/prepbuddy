<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>PrepBuddy</title>
<meta name="description" content="Upload your textbook and practise with fresh exam-style questions.">
<meta name="theme-color" content="#1E2A5A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PrepBuddy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap">
<style>
:root{--ink:#1E2A5A;--text:#1E2A5A;--text-2:#3F4868;--muted:#5A6380;--muted-2:#7A829C;--line:#DCE2EE;--bg:#F4F6FA;--grid:#E3E8F1;--accent:#26357A;--accent-dark:#18225A;--accent-soft:#EEF1FB;--accent-tint:#D6DCF3;--good:#18966A;--good-dark:#0E6E4D;--good-soft:#E5F5EE;--miss:#D93A2B;--miss-dark:#B22A1E;--miss-soft:#FDEEEC;--hl:#FFE066;--hl-soft:#FFF6CC;--hand:'Kalam','Lexend',cursive;--ui:'Lexend',system-ui,-apple-system,'PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,-apple-system,'PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;-webkit-text-size-adjust:100%}
button,textarea{font-family:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pad{padding:24px 20px}
h1,.display{font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif}
.brand{font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-size:24px;font-weight:700;letter-spacing:-.02em;margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g14{gap:14px}.g18{gap:18px}.g22{gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px}
.hero{background:var(--accent);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero small{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#CCF2EE}
.hero .title{font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-size:20px;font-weight:600;line-height:1.25}
.btn{display:block;width:100%;text-align:center;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none}
.btn:disabled{background:#9CA3AF;cursor:default}
.btn.light{background:#fff;color:var(--accent);width:auto;padding:12px 20px;font-size:15px}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #C9CED4}
.link{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:8px 0}
.link.quiet{color:var(--muted);font-weight:500;text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;cursor:pointer;min-height:44px}
.tile b{font-size:14px;color:var(--ink)}.tile span{font-size:12px;color:var(--muted)}
.row{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:none;border-bottom:1px solid #EEF0F2;background:none;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.row:last-child{border-bottom:none}
.row .top{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:500}
.bar{height:6px;border-radius:3px;background:#EEF0F2;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar.warn i{background:var(--miss)}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 12px 8px}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:22px}
.progress{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-size:13px;font-weight:600;color:var(--muted);min-width:56px;text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;color:var(--accent-dark);background:var(--accent-tint);padding:4px 10px;border-radius:999px}
.chip.grey{color:var(--muted);background:#E9EBEE;font-weight:500}
.chip.recap{background:#FFF4DB;color:#8A5A00}
.waitpage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.waitpage>*{width:100%;max-width:460px}
.wait-head{display:flex;flex-direction:column;align-items:center;gap:6px}
.wait-head h1{margin:0;font-size:22px}
.wait-head p{margin:0;font-size:14px}
.wait-prog{display:flex;align-items:center;gap:10px;width:100%;max-width:300px;margin-top:8px}
.wait-prog .progress{height:6px}
.wait-prog .hint{white-space:nowrap;font-weight:600}
.wait-sub{margin:10px 0 -4px;text-align:left}
.wcard{text-align:left;padding:18px 18px 12px;min-height:170px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--accent);animation:wcin .35s ease}
.wcard.k-tip{border-top-color:#E8A317}.wcard.k-term{border-top-color:#3F7FD9}.wcard.k-fact{border-top-color:#2E9E6A}.wcard.k-cheer{border-top-color:#F2B630;background:#FFFBF0}
@keyframes wcin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.wk{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.wbuddy{display:flex}
.wdots{display:flex;gap:5px}.wdots i{width:6px;height:6px;border-radius:3px;background:var(--line)}.wdots i.on{background:var(--accent);width:16px}
.wtitle{font-size:18px;line-height:1.35}
.wtext{margin:0;font-size:15.5px;line-height:1.55;color:var(--text-2);flex:1}
.wnext{align-self:flex-end}
.wgo:empty{display:none}
.cdhint{font-weight:500;opacity:.75;font-size:.85em;margin-left:6px}
.wait-foot{margin:4px 0 0}
@media (min-width:1024px){
  body[data-tab] .app:has(> main.waitpage){max-width:none;margin:0 0 0 220px!important;padding:0 40px}
  .app:has(> main.waitpage)>.topbar{padding-left:0;padding-right:0}
  .waitpage{gap:18px;padding-bottom:64px!important}
  .waitpage>*{max-width:680px}
  .wait-head h1{font-size:32px}
  .wait-head p{font-size:16px}
  .wait-prog{max-width:420px;margin-top:12px}
  .wait-prog .progress{height:8px}
  .wait-sub{font-size:14px;margin-top:18px}
  .wcard{padding:28px 32px 18px;min-height:250px;gap:12px;border-top-width:5px}
  .wk{font-size:13px}
  .wtitle{font-size:24px}
  .wtext{font-size:19px;line-height:1.6}
  .wgo .btn{max-width:360px;margin:0 auto;display:flex;justify-content:center;align-items:baseline}
  .wait-foot{font-size:14px}
}
.stem{margin:0;font-size:15px;line-height:1.55;color:#374151;white-space:pre-line}
.q{margin:0;font-size:18px;line-height:1.45;font-weight:500}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:15px;line-height:1.4;color:var(--ink);cursor:pointer;width:100%}
.opt .dot{flex-shrink:0;width:26px;height:26px;border-radius:13px;border:1px solid #C9CED4;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--muted)}
.opt.picked{border:2px solid var(--ink)}
.opt.right{border:2px solid var(--accent);background:var(--accent-soft)}
.opt.right .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.wrong{border:2px solid var(--miss);background:var(--miss-soft)}
.opt.wrong .dot{border:2px solid var(--miss);color:var(--miss)}
.opt:disabled{cursor:default}
table.data{border-collapse:collapse;font-size:14px;margin:4px 0}
table.data td,table.data th{border:1px solid var(--line);padding:6px 10px;text-align:left;background:#fff}
.part{display:flex;flex-direction:column;gap:8px}
.part .ph{display:flex;justify-content:space-between;gap:12px;font-size:16px;line-height:1.45;font-weight:500}
.part .ph .mk{white-space:nowrap;font-size:13px;font-weight:600;color:var(--muted);padding-top:2px}
textarea{width:100%;min-height:120px;resize:vertical;border:2px solid #C9CED4;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.5;color:var(--ink);background:#fff}
textarea:focus{outline:none;border-color:var(--accent)}
.hint{font-size:13px;color:var(--muted)}
.sheet{background:#fff;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.verdict{font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-size:20px;font-weight:700}
.verdict.ok{color:var(--accent)}.verdict.no{color:var(--miss-dark)}
.expl,.tipline{margin:0;font-size:14px;line-height:1.5;color:#374151}
.src{font-size:12px;color:var(--muted);line-height:1.45}
.point{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:#fff;cursor:pointer;text-align:left;width:100%;font-size:15px;line-height:1.45;color:var(--ink)}
.point .box{flex-shrink:0;width:24px;height:24px;border-radius:7px;border:2px solid #9CA3AF;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:1px}
.point.on{background:var(--accent-soft);border-color:var(--accent)}
.point.on .box{background:var(--accent);border-color:var(--accent)}
.yours{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.5;color:#374151;white-space:pre-wrap}
.yours.empty{color:#6B7280;font-style:italic}
.score{font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-size:48px;font-weight:700;line-height:1}
.res{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #EEF0F2;font-size:14px;line-height:1.4}
.res:last-child{border-bottom:none}
.tick{flex-shrink:0;width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.tick.full{background:var(--accent);color:#fff}.tick.part{border:2px solid var(--miss);color:var(--miss)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.timer.low{color:var(--miss-dark)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:10}
footer{padding:8px 20px 28px;font-size:11px;line-height:1.5;color:#6B7280}
footer a{color:#4B5563}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
.input{width:100%;border:2px solid #C9CED4;border-radius:14px;padding:14px;font-size:17px;font-family:inherit;background:#fff;color:var(--ink)}
.input:focus{outline:none;border-color:var(--accent)}
.chapter-head{padding:12px 16px 6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:#FAFAFB;border-bottom:1px solid #EEF0F2}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--accent-tint);border-top-color:var(--accent);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}
.searchbox{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:0 14px;min-height:50px}
.searchbox input{flex:1;border:none;outline:none;font-size:16px;font-family:inherit;background:transparent;color:var(--ink);min-width:0;padding:14px 0}
.searchbox.light{border:2px solid #C9CED4}.searchbox.light:focus-within{border-color:var(--accent)}
.libcard{display:flex;gap:14px;padding:14px;align-items:flex-start}
.cover{flex-shrink:0;width:52px;height:68px;border-radius:8px;background:var(--accent-tint);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase}
.btn.small{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:auto;align-self:flex-start;padding:10px 14px;font-size:14px;border-radius:12px;margin-top:4px;min-height:44px}
.row .box{flex-shrink:0;width:24px;height:24px;border-radius:7px;border:2px solid #9CA3AF;display:flex;align-items:center;justify-content:center;color:#fff;margin-top:-1px}
.row .box.on{background:var(--accent);border-color:var(--accent)}
.row.picked{background:var(--accent-soft)}
.sheet .btn:disabled{background:#9CA3AF}
.sheet.sticky{position:sticky;bottom:0;box-shadow:0 -1px 0 var(--line)}
table.usage{font-size:13px}table.usage td{text-align:right;white-space:nowrap}table.usage th{white-space:nowrap}
.marker{background:var(--miss-soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;color:#374151}
.marker b{color:var(--miss-dark);margin-right:4px}
.marker.full{background:var(--accent-soft)}.marker.full b{color:var(--accent-dark)}
.btn.ghost{display:flex;align-items:center;justify-content:center;gap:8px}
.spinner.small{width:18px;height:18px;border-width:3px}
.review-card{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--accent);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.review-card b{font-size:15px}.review-card span span{font-size:13px;color:var(--muted)}
.langbtn{flex:none;border:1px solid #D1D5DB;background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:#0F766E;cursor:pointer;min-height:36px}
.review-card .pill{background:var(--accent);color:#fff;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;white-space:nowrap}
.review-card.done{border:1px solid var(--line);cursor:default}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px}
.week span{width:34px;height:34px;border-radius:17px;background:#E3E6EA}.week span.on{background:var(--accent)}.week span.today{box-shadow:0 0 0 3px var(--accent-tint)}
.week small{font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#E9EBEE;border-radius:12px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;border-radius:10px;min-height:40px;font-family:inherit;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn.danger{background:#B42318}
.setup{gap:12px}
.setup-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.setup-row>span{font-size:14px;color:var(--muted);white-space:nowrap}
.setup-row .seg{flex:1;max-width:250px}
.stepper{display:flex;align-items:center;gap:4px;background:#E9EBEE;border-radius:12px;padding:3px}
.stepper button{width:44px;height:40px;border:none;border-radius:10px;background:#fff;font-size:22px;font-weight:600;color:var(--ink);cursor:pointer}
.stepper button:disabled{opacity:.4;cursor:default}
.stepper output{min-width:44px;text-align:center;font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-size:20px;font-weight:700}
.chips-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;font-family:inherit;color:var(--ink);min-height:44px}
.choice b{font-size:14px}.choice span{font-size:12px;color:var(--muted);line-height:1.35}
.choice.on{border:2px solid var(--accent);background:var(--accent-soft)}
.chip.sec{background:#14181F;color:#fff}
.paper{background:#fff;color:#111;font-family:Georgia,'Times New Roman','Noto Serif CJK TC',serif;padding:28px 24px;line-height:1.5;font-size:15px}
.paper h1{font-size:22px;margin:0 0 6px}.paper h2{font-size:17px;border-bottom:2px solid #111;padding-bottom:4px;margin:28px 0 6px}
.pmeta{margin:0 0 18px;color:#444;font-size:13px}.pnote{margin:0 0 10px;color:#444;font-size:13px;font-style:italic}
.pfields{display:flex;gap:18px;font-size:14px;margin-bottom:8px}.pfields span{flex:1;border-bottom:1px solid #888;padding-bottom:2px}
.pq{margin:16px 0 20px;page-break-inside:avoid;break-inside:avoid}.pqh{display:flex;justify-content:space-between}
.pm{font-size:12px;color:#555;white-space:nowrap;margin-left:12px;font-family:Arial,'PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif}
.pstem{margin:4px 0;white-space:pre-line}.popts{margin:6px 0 0 4px;padding-left:22px}.popts li{margin:3px 0}
.ppart{display:flex;justify-content:space-between;margin:8px 0 2px 14px}
.paper .lines{margin-left:14px}.paper .lines div{border-bottom:1px dotted #999;height:26px}
.pkey{margin-top:30px}.pk{margin:10px 0;font-size:14px;page-break-inside:avoid;break-inside:avoid}.pk ul{margin:2px 0 4px 18px;padding-left:16px}
.pexp{color:#333}.psrc{color:#777;font-size:12px}.pfoot{margin-top:24px;font-size:11px;color:#777}
.ptable{width:100%;border-collapse:collapse}.ptable td{padding:0;vertical-align:top}
.pbrand{display:flex;gap:10px;align-items:center;border-top:1px solid #bbb;padding-top:6px;margin-top:24px;font-family:'Lexend',system-ui,'PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-size:10.5px;color:#444;line-height:1.35;break-inside:avoid}
.pbrand>div{display:flex;flex-direction:column}.pbrand b{font-size:11.5px;color:#111}
.pqr{width:52px;height:52px;flex:none}
@media print{
  html,body{background:#fff}
  .noprint,.tabs{display:none!important}
  body[data-tab] .app{margin:0 auto!important;padding-bottom:0!important}
  .app{max-width:none}
  .paper{padding:0}
  @page{margin:14mm 16mm 10mm}
  .ptable tfoot{display:table-footer-group}
  .paper h2,.pnote{break-after:avoid;page-break-after:avoid}
  .pbrand{margin-top:10px}
}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt.gopt{flex-direction:column;align-items:stretch;gap:4px;padding:8px 8px 10px;color:var(--ink)}
.opt.gopt .dot{align-self:flex-start}
.gcap{font-size:12px;line-height:1.35;color:var(--muted)}
.pgraphs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:8px 0 0}
.pgraphs b{font-family:Arial,'PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-size:13px}

/* ---------- iPad and laptop ---------- */
@media (hover: hover){
  .row:hover,.libcard:hover{background:#FAFAFB}.opt:not(:disabled):hover,.point:hover,.choice:hover,.tile:hover{border-color:#9CA3AF}
  .btn:not(:disabled):hover{filter:brightness(1.08)}.btn.ghost:hover{background:#F9FAFB;filter:none}
}
@media (min-width: 700px){
  .app{max-width:720px}
  .pad{padding:32px 28px}
  .topbar{padding:20px 16px 8px}
  main[style*="padding:4px 20px"]{padding-left:28px!important;padding-right:28px!important}
  .sheet{padding-left:28px;padding-right:28px}
  .brand{font-size:28px}.hero{padding:24px}.hero .title{font-size:24px}
  .q{font-size:20px}.stem{font-size:16px}.opt{font-size:16px;padding:16px}
  .tile{padding:16px 14px}.tile b{font-size:15px}.tile span{font-size:13px}
  .toast{bottom:32px}
}

.readas{margin:0;font-size:14.5px;line-height:1.5}.readas span:first-child{font-weight:600;color:var(--muted);font-size:13px}
.bookchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.bookchips::-webkit-scrollbar{display:none}
.bookchips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer;min-height:38px;white-space:nowrap}
.bookchips button b{font-size:12px;background:var(--miss-soft);color:var(--miss-dark);border-radius:999px;padding:1px 7px;margin-left:4px}
.bookchips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.bookchips button.on b{background:rgba(255,255,255,.2);color:#fff}
.erow{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-bottom:1px solid #EEF0F2}.erow:last-child{border-bottom:none}
.etitle{width:100%;border:1px solid #D7DBE0;border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff}
.etitle:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.epages{font-size:12.5px}.eacts{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.eacts .link{padding:4px 0;font-size:13.5px}
.esplit{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.esplit select{display:block;margin-top:6px;width:100%;border:1px solid #C9CED4;border-radius:10px;padding:8px;font-size:14px;font-family:inherit;background:#fff}
.hiddenrow span:first-child{color:var(--muted)}
.katex{font-size:1.06em}.katex-display{margin:.4em 0;overflow-x:auto;overflow-y:hidden;padding:2px 0}
.opt .katex,.point .katex{font-size:1.02em}

/* ================= Redesign: the study desk =================
   Squared exercise-book paper, navy pen ink, a highlighter for "today", a teacher's red pen for marking. */
html,body{background-color:var(--bg);color:var(--text);font-family:var(--ui)}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
h1,.display,.brand,.verdict,.score,.stepper output,.cover,.bookcover{font-family:var(--ui)}
.brand{font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.muted,.hint{color:var(--muted)}
.card,.tile,.row.card,.review-card,.libcard,.ncard,.mcard,.choice{border-color:var(--line)}
.card{border-radius:16px;box-shadow:0 1px 0 rgba(30,42,90,.04)}
.btn{background:var(--accent);border-radius:14px;font-weight:600;letter-spacing:.005em}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled,.sheet .btn:disabled{background:#B7BDD0}
.link{color:var(--accent)}
.sheet{border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(30,42,90,.06)}
.chip{background:var(--accent-soft);color:var(--accent-dark)}
.chip.grey{background:#EDEFF4;color:var(--muted)}
.chip.sec{background:var(--ink)}
.seg,.stepper,.ansmode{background:#E9ECF4}
.seg button.on,.ansmode button.on{color:var(--ink)}
textarea,.input,.tinput,.etitle{border-color:#CDD4E3}
textarea:focus,.input:focus,.tinput:focus{border-color:var(--accent)}
.progress{background:#E3E7F1}.progress i{background:var(--accent)}
.bar i{background:var(--good)}.bar.warn i{background:var(--miss)}
.row.picked{background:var(--accent-soft)}
.row .box.on,.point.on .box{background:var(--accent);border-color:var(--accent)}
/* answers: green tick, red pen */
.opt{border-color:var(--line);border-radius:14px}
.opt.picked{border:2px solid var(--accent);background:var(--accent-soft)}
.opt.right{border:2px solid var(--good);background:var(--good-soft)}
.opt.right .dot{background:var(--good);border-color:var(--good)}
.opt.wrong{border:2px solid var(--miss);background:var(--miss-soft)}
.opt.wrong .dot{border-color:var(--miss);color:var(--miss)}
.point.on{background:var(--good-soft);border-color:var(--good)}.point.on .box{background:var(--good);border-color:var(--good)}
.marker{background:var(--miss-soft)}.marker b{color:var(--miss-dark);font-family:var(--hand);font-size:17px}
.marker.full{background:var(--good-soft)}.marker.full b{color:var(--good-dark)}
.tick.full{background:var(--good)}.tick.part{border-color:var(--miss);color:var(--miss)}
/* the teacher's pen: verdicts and scores are written by hand */
.verdict{font-size:24px;font-weight:700;line-height:1.2}
.verdict.ok,.verdict.no{font-family:var(--hand);font-size:27px}
.verdict.ok{color:var(--good-dark)}.verdict.no{color:var(--miss)}
.score{font-family:var(--hand);font-weight:700;font-size:58px;color:var(--miss);display:inline-block;padding:2px 18px 0;border:3px solid var(--miss);border-radius:48% 52% 46% 54%/55% 45% 55% 45%;transform:rotate(-3deg);align-self:flex-start;line-height:1.1}
/* exercise-book paper for questions: a red margin line down the left */
main.qpaper{background:#fff;background-image:linear-gradient(90deg,transparent 30px,#F3B3AB 30px,#F3B3AB 31.5px,transparent 31.5px);padding-left:46px!important;border-radius:0}
@media (min-width:700px){main.qpaper{border:1px solid var(--line);border-radius:6px;margin:4px 16px 16px}}
/* highlighter */
.hl{background:linear-gradient(transparent 52%,var(--hl) 52%,var(--hl) 92%,transparent 92%);padding:0 3px;border-radius:2px}

/* ---------- Today ---------- */
.today{gap:22px}
.greet h1{margin:0;font-size:26px;font-weight:700;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
.greet p{margin:4px 0 0;color:var(--muted);font-size:14.5px}
.plan{background:#fff;border:1px solid var(--line);border-radius:18px;padding:6px 16px;display:flex;flex-direction:column}
.plan h2{margin:0 0 6px;font-size:16px;font-weight:700}
.plan-item{display:flex;gap:14px;align-items:center;padding:13px 0;border:none;border-top:1px solid #EEF1F6;background:none;text-align:left;width:100%;cursor:pointer;color:var(--ink);font-family:inherit}
.plan-item:first-of-type{border-top:none}
.plan-item .pi-icon{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.plan-item .pi-text{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.plan-item b{font-size:15.5px;font-weight:600}.plan-item span.sub{font-size:13px;color:var(--muted)}
.plan-item .go{flex:none;font-size:13.5px;font-weight:600;color:var(--accent-dark);background:var(--hl);border-radius:999px;padding:7px 13px}
.plan-item.done{cursor:default}.plan-item.done .go{background:var(--good-soft);color:var(--good-dark)}
.pi-review{background:var(--accent-soft);color:var(--accent)}.pi-mistake{background:var(--miss-soft);color:var(--miss)}.pi-continue{background:var(--good-soft);color:var(--good-dark)}
.sect-head{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:36px}.sect-head h2{margin:0;font-size:16px;font-weight:700}
.shelf{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}.shelf::-webkit-scrollbar{display:none}
.bookcover{flex:none;width:118px;height:156px;border-radius:6px 12px 12px 6px;border:none;cursor:pointer;color:#fff;text-align:left;padding:12px 12px 10px 18px;display:flex;flex-direction:column;justify-content:space-between;position:relative;box-shadow:0 2px 0 rgba(0,0,0,.08),0 8px 18px rgba(30,42,90,.12);font-family:var(--ui)}
.bookcover::before{content:'';position:absolute;left:6px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
.bookcover .c-sub{font-size:11.5px;font-weight:600;opacity:.85}
.bookcover .c-title{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bookcover .c-meter{height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}.bookcover .c-meter i{display:block;height:100%;background:#fff}
.bookcover.add{background:#fff;color:var(--accent);border:2px dashed #C6CDE0;box-shadow:none;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;padding:12px}
.bookcover.add::before{display:none}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qtile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink)}
.qtile b{font-size:15px;font-weight:600}.qtile span{font-size:12.5px;color:var(--muted);line-height:1.35}
.qtile svg{color:var(--accent)}
.weekstrip{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;width:100%;text-align:left;font-family:inherit;color:var(--ink)}
.weekstrip .dots{display:flex;gap:6px}.weekstrip .dots i{width:12px;height:12px;border-radius:50%;background:#E3E7F1}.weekstrip .dots i.on{background:var(--good)}
.weekstrip .wt{flex:1;display:flex;flex-direction:column;gap:2px}.weekstrip b{font-size:14.5px}.weekstrip span{font-size:12.5px;color:var(--muted)}
.empty-start{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 18px;display:flex;flex-direction:column;gap:12px}
.empty-start h2{margin:0;font-size:20px;line-height:1.3}
.empty-start .searchbox{border:2px solid #CDD4E3}.empty-start .searchbox:focus-within{border-color:var(--accent)}
.langbtn{border-color:var(--line);color:var(--accent)}

.pagetitle{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.spine{flex:none;width:10px;height:40px;border-radius:3px}
.tabs svg{width:22px;height:22px}
.pi-icon svg{width:24px;height:24px}
body[data-tab] .sheet.sticky{bottom:calc(64px + env(safe-area-inset-bottom))}
@media (min-width:1024px){body[data-tab] .sheet.sticky{bottom:24px}}
.bar.mid i{background:var(--accent)}
@media (max-width:1023px){.sheet.setup:not(.armed){position:static;box-shadow:none;border-radius:18px;border:1px solid var(--line);margin:0 0 4px!important}}
/* mastery */
.areas{border-top:1px solid #EEF1F6;padding-top:8px}.areas summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--accent);padding:2px 0 6px}
.area{display:grid;grid-template-columns:1fr 90px 40px;gap:10px;align-items:center;font-size:13.5px;padding:4px 0}
.area span small{color:var(--muted-2);margin-left:6px;font-size:11.5px}.area b{text-align:right;font-size:13px}
.abar{height:7px;border-radius:4px;background:#E9ECF4;overflow:hidden}.abar i{display:block;height:100%;background:var(--miss)}.abar i.mid{background:var(--accent)}.abar i.good{background:var(--good)}
#ctest{display:flex;gap:8px;align-items:center;justify-content:center}
.mastery{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.m-top{display:flex;gap:16px;align-items:center}
.ring{--p:0;--c:var(--miss);flex:none;width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#E9ECF4 0);display:grid;place-items:center}
.ring.mid{--c:var(--accent)}.ring.good{--c:var(--good)}
.ring span{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--ink)}
.m-text{display:flex;flex-direction:column;gap:3px}.m-text b{font-size:18px;font-weight:700}.m-text span{font-size:13.5px;color:var(--muted);line-height:1.4}
.m-steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;border-top:1px solid #EEF1F6;padding-top:8px}
.m-steps li{display:flex;gap:8px;align-items:baseline}.m-steps li::before{content:'';flex:none;width:7px;height:7px;border-radius:50%;background:var(--hl);border:1.5px solid #E5C33C;transform:translateY(-1px)}
.m-steps .link{text-align:left;padding:5px 0;font-size:14px;font-weight:500;line-height:1.4}
.mastery .btn{display:flex;gap:8px;align-items:center;justify-content:center}.mastery .btn svg{color:#fff}
.m-pill{flex:none;display:flex;flex-direction:column;align-items:flex-end;font-weight:700;font-size:16px;color:var(--miss)}.m-pill small{font-size:11px;font-weight:500;color:var(--muted)}
.m-pill.mid{color:var(--accent)}.m-pill.good{color:var(--good)}
.mrowb{display:flex;gap:12px;align-items:center;border:none;background:none;padding:6px 0;cursor:pointer;width:100%;text-align:left;font-family:inherit;color:var(--ink)}
.mrowb .mt{flex:1;display:flex;flex-direction:column;gap:6px}.mrowb b{font-size:14.5px;font-weight:600}
.bookcover .c-foot{display:flex;flex-direction:column;gap:5px}.bookcover .c-foot b{font-size:20px;font-weight:700;line-height:1}

/* ---------- book screen: grouped chapters + side panel ---------- */
.setup-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.setup-more{display:none;padding:0;font-size:13.5px;white-space:nowrap}
@media (max-width:1023px){
  .sheet.setup.armed{gap:10px;padding-top:14px}
  .sheet.setup.armed .setup-more{display:inline-flex}
  .sheet.setup.armed:not(.expanded) .setup-row,.sheet.setup.armed:not(.expanded) #ctest,.sheet.setup.armed:not(.expanded) .revise-row,.sheet.setup.armed:not(.expanded) #paper{display:none}
}
.bookpage{display:flex;flex-direction:column;gap:14px;padding:4px 20px 24px;flex:1}
.bk-side{display:contents}
.bk-side .mastery{order:-1}
.bk-side .sheet.setup{order:3;margin:0 -20px -24px}
.bk-main{order:1}
.chtools{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap}
.chtools p{flex:1}
.chsearch{display:flex;align-items:center;gap:8px;border:1.5px solid #CDD4E3;border-radius:12px;padding:0 10px;background:#fff;flex-basis:100%;min-height:42px}
.chsearch:focus-within{border-color:var(--accent)}
.chsearch span{display:flex;color:var(--muted)}.chsearch input{border:none;outline:none;flex:1;font:15px var(--ui);background:transparent;color:var(--ink);min-width:0;padding:9px 0}
.chlist{display:flex;flex-direction:column;gap:8px}
.cgroup{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ghead{display:flex;align-items:center;gap:10px;padding:0 6px 0 14px}
.gpick.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #9CA3AF;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;padding:0}
.gpick.box.on{background:var(--accent);border-color:var(--accent)}
.gpick .partial{width:10px;height:2.5px;background:var(--accent);border-radius:2px;display:block}
.gtoggle{flex:1;display:flex;align-items:center;gap:10px;border:none;background:none;padding:14px 8px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;min-width:0}
.gtoggle b{font-size:15px;font-weight:600}.gmeta{flex:1;font-size:12.5px;color:var(--muted)}
.chev{display:flex;color:var(--muted);transform:rotate(-90deg);transition:transform .15s}.cgroup.open .chev{transform:rotate(90deg)}
.gbody{display:flex;flex-direction:column;border-top:1px solid #EEF1F6}
.gbody.flat{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.crow{display:flex;align-items:center;gap:12px;padding:10px 14px;border:none;border-bottom:1px solid #F0F2F7;background:#fff;width:100%;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);min-height:48px}
.crow:last-child{border-bottom:none}
.crow .box{flex-shrink:0;width:22px;height:22px;border-radius:6px;border:2px solid #9CA3AF;display:flex;align-items:center;justify-content:center;color:#fff}
.crow .box.on{background:var(--accent);border-color:var(--accent)}
.crow.picked{background:var(--accent-soft)}
.crow .ct{flex:1;font-size:14.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.crow .cp,.gtoggle .cp{flex:none;font-weight:700;font-size:14px}
.crow .cpp{flex:none;font-size:12px;color:var(--muted-2)}
@media (hover:hover){.crow:hover{background:#F7F8FC}.crow.picked:hover{background:var(--accent-soft)}}
@media (min-width:1024px){
  .app:has(.bookpage){max-width:1400px;padding:0 32px}
  .app:has(.bookpage)>.topbar{padding-left:0}
  .bookpage{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start;padding:4px 0 32px}
  .bk-side{display:flex;flex-direction:column;gap:14px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;grid-column:2;grid-row:1}
  .bk-main{grid-column:1;grid-row:1}
  .bk-side .sheet.setup{margin:0;position:static;border:1px solid var(--line);border-radius:18px;box-shadow:none;padding:18px}
  .bk-side .mastery .m-top .ring{width:72px;height:72px}.bk-side .mastery .ring span{width:56px;height:56px;font-size:17px}
  .chsearch{flex-basis:260px;flex-grow:0}
  .gbody{display:grid;grid-template-columns:1fr 1fr}
  .gbody .crow{border-right:1px solid #F0F2F7}
  .gbody.flat{display:grid;grid-template-columns:1fr 1fr}
}
@media (min-width:1600px){.gbody,.gbody.flat{grid-template-columns:1fr 1fr 1fr}}
/* ---------- tab bar (bottom on phones, side on laptops) ---------- */

body[data-tab] .tabs{display:flex}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:center}
.tabs .tabs-in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tabs button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-family:var(--ui);font-size:11.5px;font-weight:500;color:var(--muted-2);cursor:pointer;position:relative;min-height:48px}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs button.on svg{color:var(--accent)}
.tabs button .badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--miss);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px}
body[data-tab] .app{padding-bottom:76px}
.tabs .brand-side{display:none}
@media (min-width:1024px){
  body[data-tab] .tabs{top:0;bottom:0;right:auto;width:220px;border-top:none;border-right:1px solid var(--line);flex-direction:column;justify-content:flex-start;padding:24px 14px}

  .tabs button{flex-direction:row;gap:12px;justify-content:flex-start;padding:10px 12px;border-radius:12px;font-size:14.5px;min-height:44px}

  body[data-tab] .app{padding-bottom:0;margin-left:max(240px,calc((100vw - 1100px)/2 + 120px))}
}

/* ---------- results screen ---------- */
.results{flex:1;display:flex;flex-direction:column;gap:18px}
.r-left{display:flex;flex-direction:column;gap:14px}
.rhero{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;border-top:5px solid var(--miss)}
.rhero.mid{border-top-color:var(--accent)}.rhero.good{border-top-color:var(--good)}
.rmeta{font-size:13px;color:var(--muted)}
.rtop{display:flex;gap:16px;align-items:center}
.rtop .ring{width:96px;height:96px}.rtop .ring span{width:76px;height:76px;font-size:24px}
.rhead{display:flex;flex-direction:column;gap:4px}.rhead b{font-size:22px;font-weight:700;line-height:1.2}.rhead span{font-size:15px;color:var(--muted);font-weight:500}
.rsub{margin:0;font-size:14.5px;line-height:1.5;color:var(--text-2)}
.rcounts{display:flex;flex-wrap:wrap;gap:8px}
.rcounts span{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:13.5px;font-weight:600}
