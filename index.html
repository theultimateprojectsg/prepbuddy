<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap">
<style>
:root{--ink:#1E2A5A;--text:#1E2A5A;--text-2:#3F4868;--muted:#5A6380;--muted-2:#7A829C;--line:#DCE2EE;--bg:#F4F6FA;--grid:#DCE2EE;--accent:#26357A;--accent-dark:#18225A;--accent-soft:#EEF1FB;--accent-tint:#D6DCF3;--good:#18966A;--good-dark:#0E6E4D;--good-soft:#E5F5EE;--miss:#D93A2B;--miss-dark:#B22A1E;--miss-soft:#FDEEEC;--hl:#FFE066;--hl-soft:#FFF6CC;--hand:'Kalam','Lexend',cursive;--ui:'Lexend',system-ui,-apple-system,'PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lexend',system-ui,-apple-system,'PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;-webkit-text-size-adjust:100%}
button,textarea{font-family:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pad{padding:24px 20px}
h1,.display{font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif}
.brand{font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column}
.g6{gap:8px}.g8{gap:8px}.g10{gap:12px}.g14{gap:16px}.g18{gap:16px}.g22{gap:24px}
.card{background:#FFFFFF;border:1px solid var(--line);border-radius:16px}
.hero{background:var(--accent);color:#FFFFFF;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero small{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#E5F5EE}
.hero .title{font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-size:22px;font-weight:600;line-height:1.25}
.btn{display:block;width:100%;text-align:center;border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:600;cursor:pointer;background:var(--accent);color:#FFFFFF;text-decoration:none}
.btn:disabled{background:#7A829C;cursor:default}
.btn.light{background:#FFFFFF;color:var(--accent);width:auto;padding:12px 20px;font-size:16px}
.btn.ghost{background:#FFFFFF;color:var(--ink);border:1px solid #DCE2EE}
.link{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;padding:8px 0}
.link.quiet{color:var(--muted);font-weight:500;text-decoration:underline}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:#FFFFFF;border:1px solid var(--line);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;cursor:pointer;min-height:44px}
.tile b{font-size:14px;color:var(--ink)}.tile span{font-size:12px;color:var(--muted)}
.row{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:none;border-bottom:1px solid #EEF1F6;background:none;text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.row:last-child{border-bottom:none}
.row .top{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:500}
.bar{height:6px;border-radius:3px;background:#EEF1F6;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.bar.warn i{background:var(--miss)}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 12px 8px}
.icon-btn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:20px}
.progress{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-size:14px;font-weight:600;color:var(--muted);min-width:56px;text-align:right}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;color:var(--accent-dark);background:var(--accent-tint);padding:4px 10px;border-radius:999px}
.chip.grey{color:var(--muted);background:#EEF1F6;font-weight:500}
.chip.recap{background:#FFF8E1;color:#7A5200}
.waitpage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.waitpage>*{width:100%;max-width:460px}
/* waiting: Buddy busy writing your questions */
.wbud{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:16px;height:132px;margin-bottom:4px}
.wbud-me{position:relative;display:flex;flex-direction:column;align-items:center}
.wbud-b{animation:wbob 1.6s ease-in-out infinite;transform-origin:50% 100%}.wbud-b .buddy{display:block}
@keyframes wbob{0%,100%{transform:translateY(0) rotate(-3deg)}25%{transform:translateY(-10px) rotate(0)}50%{transform:translateY(0) rotate(3deg) scaleY(.96)}75%{transform:translateY(-6px) rotate(0)}}
.wbud-shadow{width:56px;height:8px;border-radius:50%;background:rgba(30,42,90,.14);margin-top:2px;animation:wshad 1.6s ease-in-out infinite}
@keyframes wshad{0%,50%,100%{transform:scaleX(1);opacity:1}25%{transform:scaleX(.7);opacity:.6}75%{transform:scaleX(.8);opacity:.7}}
.wbud-bubble{position:absolute;top:-6px;right:-30px;display:flex;gap:4px;background:#FFFFFF;border:1.5px solid #DCE2EE;border-radius:16px;padding:7px 9px;box-shadow:0 1px 2px rgba(30,42,90,.06)}
.wbud-bubble i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:wdot 1.2s ease-in-out infinite}.wbud-bubble i:nth-child(2){animation-delay:.2s}.wbud-bubble i:nth-child(3){animation-delay:.4s}
@keyframes wdot{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
.wbud-paper{position:relative;margin-bottom:10px;animation:wpaper 3.2s ease-in-out infinite}
@keyframes wpaper{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-1deg) translateY(-3px)}}
.wbud-paper .wl{stroke:#9DB6F2;stroke-width:4;stroke-linecap:round;stroke-dasharray:44;stroke-dashoffset:44;animation:wwrite 4s linear infinite}
.wbud-paper .l2{animation-delay:.8s}.wbud-paper .l3{animation-delay:1.6s}.wbud-paper .l4{animation-delay:2.4s}
@keyframes wwrite{0%{stroke-dashoffset:44}18%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
.wbud-pen{position:absolute;font-size:22px;left:30px;top:6px;animation:wpen 4s ease-in-out infinite}
@keyframes wpen{0%{transform:translate(-22px,0)}18%{transform:translate(18px,0)}20%{transform:translate(-22px,12px)}38%{transform:translate(14px,12px)}40%{transform:translate(-22px,24px)}58%{transform:translate(18px,24px)}60%{transform:translate(-22px,36px)}78%{transform:translate(4px,36px)}100%{transform:translate(-22px,0)}}
.wsp{position:absolute;color:#FFC531;font-size:14px;opacity:0;animation:wspk 2.4s ease-in-out infinite}
.wsp.s1{left:calc(50% + 62px);top:18px}.wsp.s2{left:calc(50% - 92px);top:4px;animation-delay:.8s;color:#9DB6F2}.wsp.s3{left:calc(50% + 40px);top:92px;animation-delay:1.6s;font-size:12px}
@keyframes wspk{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.1) rotate(20deg)}}
.wbud.small{height:104px}.wbud.small .buddy{width:72px;height:72px}
.wbud.ready .wbud-bubble,.wbud.ready .wbud-pen{display:none}.wbud.ready .wbud-b{animation:wjump .9s ease-in-out infinite}.wbud.ready .wl{animation:none;stroke-dashoffset:0}
@keyframes wjump{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) scale(1.04)}}
.wstat{margin:6px 0 0;font-size:14px;font-weight:600;color:var(--accent);min-height:20px}.wstat.in{animation:wcin .35s ease}
.wait-prog .progress.busy{position:relative;overflow:hidden}.wait-prog .progress.busy::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-100%);animation:wshim 1.4s linear infinite}
.wait-prog .progress.busy{background:repeating-linear-gradient(-45deg,#DCE2EE 0 8px,#EEF1F6 8px 16px);background-size:22px 22px;animation:wstripe .8s linear infinite}
@keyframes wshim{to{transform:translateX(100%)}}@keyframes wstripe{to{background-position:22px 0}}
/* 'Reduce motion' on: keep Buddy moving (so the page never looks frozen), just calmer */
@media (prefers-reduced-motion:reduce){.wbud-b{animation-duration:2.6s!important}.wbud-shadow{animation-duration:2.6s!important}.wsp{display:none}.wbud-paper{animation:none}}
@media (min-width:1024px){.wbud{height:160px}.wbud .wbud-b .buddy{width:112px;height:112px}.wstat{font-size:16px}}
.wait-head{display:flex;flex-direction:column;align-items:center;gap:8px}
.wait-head h1{margin:0;font-size:22px}
.wait-head p{margin:0;font-size:14px}
.wait-prog{display:flex;align-items:center;gap:12px;width:100%;max-width:300px;margin-top:8px}
.wait-prog .progress{height:6px}
.wait-prog .hint{white-space:nowrap;font-weight:600}
.wait-sub{margin:10px 0 -4px;text-align:left}
.wcard{text-align:left;padding:18px 18px 12px;min-height:170px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--accent);animation:wcin .35s ease}
.wcard.k-tip{border-top-color:#E8A317}.wcard.k-term{border-top-color:#3F7FD9}.wcard.k-fact{border-top-color:#18966A}.wcard.k-cheer{border-top-color:#FFC531;background:#FDF1E7}
@keyframes wcin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.wcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}
.wk{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.wbuddy{display:flex}
.wdots{display:flex;gap:4px}.wdots i{width:6px;height:6px;border-radius:3px;background:var(--line)}.wdots i.on{background:var(--accent);width:16px}
.wtitle{font-size:18px;line-height:1.35}
.wtext{margin:0;font-size:16px;line-height:1.55;color:var(--text-2);flex:1}
.wnext{align-self:flex-end}
.wgo:empty{display:none}
.cdhint{font-weight:500;opacity:.75;font-size:.85em;margin-left:6px}
.wait-foot{margin:4px 0 0}
@media (min-width:1024px){
  body[data-tab] .app:has(> main.waitpage){max-width:none;margin:0 0 0 220px!important;padding:0 40px}
  .app:has(> main.waitpage)>.topbar{padding-left:0;padding-right:0}
  .waitpage{gap:16px;padding-bottom:64px!important}
  .waitpage>*{max-width:680px}
  .wait-head h1{font-size:34px}
  .wait-head p{font-size:16px}
  .wait-prog{max-width:420px;margin-top:12px}
  .wait-prog .progress{height:8px}
  .wait-sub{font-size:14px;margin-top:18px}
  .wcard{padding:28px 32px 18px;min-height:250px;gap:12px;border-top-width:5px}
  .wk{font-size:14px}
  .wtitle{font-size:22px}
  .wtext{font-size:18px;line-height:1.6}
  .wgo .btn{max-width:360px;margin:0 auto;display:flex;justify-content:center;align-items:baseline}
  .wait-foot{font-size:14px}
}
.stem{margin:0;font-size:16px;line-height:1.55;color:#1E2A5A;white-space:pre-line}
.q{margin:0;font-size:18px;line-height:1.45;font-weight:500;white-space:pre-line}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:#FFFFFF;font-size:16px;line-height:1.4;color:var(--ink);cursor:pointer;width:100%}
.opt .dot{flex-shrink:0;width:26px;height:26px;border-radius:12px;border:1px solid #DCE2EE;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--muted)}
.opt.picked{border:2px solid var(--ink)}
.opt.right{border:2px solid var(--accent);background:var(--accent-soft)}
.opt.right .dot{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.opt.wrong{border:2px solid var(--miss);background:var(--miss-soft)}
.opt.wrong .dot{border:2px solid var(--miss);color:var(--miss)}
.opt:disabled{cursor:default}
table.data{border-collapse:collapse;font-size:14px;margin:4px 0}
table.data td,table.data th{border:1px solid var(--line);padding:6px 10px;text-align:left;background:#FFFFFF}
.part{display:flex;flex-direction:column;gap:8px}
.part .ph{display:flex;justify-content:space-between;gap:12px;font-size:16px;line-height:1.45;font-weight:500}
.part .ph .mk{white-space:nowrap;font-size:14px;font-weight:600;color:var(--muted);padding-top:2px}
textarea{width:100%;min-height:120px;resize:vertical;border:2px solid #DCE2EE;border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.5;color:var(--ink);background:#FFFFFF}
textarea:focus{outline:none;border-color:var(--accent)}
.hint{font-size:14px;color:var(--muted)}
.sheet{background:#FFFFFF;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.verdict{font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-size:22px;font-weight:700}
.verdict.ok{color:var(--accent)}.verdict.no{color:var(--miss-dark)}
.expl,.tipline{margin:0;font-size:14px;line-height:1.5;color:#1E2A5A}
.src{font-size:12px;color:var(--muted);line-height:1.45}
.point{display:flex;gap:12px;align-items:flex-start;border-radius:16px;padding:12px 14px;border:1px solid var(--line);background:#FFFFFF;cursor:pointer;text-align:left;width:100%;font-size:16px;line-height:1.45;color:var(--ink)}
.point .box{flex-shrink:0;width:24px;height:24px;border-radius:8px;border:2px solid #7A829C;display:flex;align-items:center;justify-content:center;color:#FFFFFF;margin-top:1px}
.point.on{background:var(--accent-soft);border-color:var(--accent)}
.point.on .box{background:var(--accent);border-color:var(--accent)}
.yours{background:#FFFFFF;border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.5;color:#1E2A5A;white-space:pre-wrap}
.yours.empty{color:var(--muted);font-style:italic}
.score{font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-size:48px;font-weight:700;line-height:1}
.res{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid #EEF1F6;font-size:14px;line-height:1.4}
.res:last-child{border-bottom:none}
.tick{flex-shrink:0;width:22px;height:22px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.tick.full{background:var(--accent);color:#FFFFFF}.tick.part{border:2px solid var(--miss);color:var(--miss)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.timer.low{color:var(--miss-dark)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#FFFFFF;padding:12px 18px;border-radius:12px;font-size:14px;z-index:10}
footer{padding:8px 20px 28px;font-size:12px;line-height:1.5;color:var(--muted)}
footer a{color:#5A6380}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
/* No double-tap zoom (a quick second tap on a tab used to zoom the page in); pinch-zoom still works */
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iPhones zoom in when a text box is under 16px: keep them at 16px or more on phones */
@media (max-width:1023px){input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea{font-size:max(16px,1em)!important}}
.input{width:100%;border:2px solid #DCE2EE;border-radius:16px;padding:14px;font-size:18px;font-family:inherit;background:#FFFFFF;color:var(--ink)}
.input:focus{outline:none;border-color:var(--accent)}
.chapter-head{padding:12px 16px 6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:#FFFFFF;border-bottom:1px solid #EEF1F6}
.spinner{width:44px;height:44px;border-radius:50%;border:4px solid var(--accent-tint);border-top-color:var(--accent);animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}
.searchbox{display:flex;align-items:center;gap:12px;background:#FFFFFF;border-radius:16px;padding:0 14px;min-height:50px}
.searchbox input{flex:1;border:none;outline:none;font-size:16px;font-family:inherit;background:transparent;color:var(--ink);min-width:0;padding:14px 0}
.searchbox.light{border:2px solid #DCE2EE}.searchbox.light:focus-within{border-color:var(--accent)}
.libcard{display:flex;gap:16px;padding:14px;align-items:flex-start}
.cover{flex-shrink:0;width:52px;height:68px;border-radius:8px;background:var(--accent-tint);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-family:'Lexend','PingFang HK','PingFang TC','Microsoft JhengHei','Noto Sans TC','Noto Sans CJK TC',sans-serif;font-weight:700;font-size:14px;text-transform:uppercase}
.btn.small{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:auto;align-self:flex-start;padding:10px 14px;font-size:14px;border-radius:12px;margin-top:4px;min-height:44px}
.row .box{flex-shrink:0;width:24px;height:24px;border-radius:8px;border:2px solid #7A829C;display:flex;align-items:center;justify-content:center;color:#FFFFFF;margin-top:-1px}
.row .box.on{background:var(--accent);border-color:var(--accent)}
.row.picked{background:var(--accent-soft)}
.sheet .btn:disabled{background:#7A829C}
.sheet.sticky{position:sticky;bottom:0;box-shadow:0 -1px 0 var(--line)}
table.usage{font-size:14px}table.usage td{text-align:right;white-space:nowrap}table.usage th{white-space:nowrap}
.marker{background:var(--miss-soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5;color:#1E2A5A}
.marker b{color:var(--miss-dark);margin-right:4px}
.marker.full{background:var(--accent-soft)}.marker.full b{color:var(--accent-dark)}
.btn.ghost{display:flex;align-items:center;justify-content:center;gap:8px}
.spinner.small{width:18px;height:18px;border-width:3px}
.review-card{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:#FFFFFF;border:2px solid var(--accent);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--ink)}
.review-card b{font-size:16px}.review-card span span{font-size:14px;color:var(--muted)}
.langbtn{flex:none;border:1px solid #DCE2EE;background:#FFFFFF;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:600;color:#0F766E;cursor:pointer;min-height:36px}
.review-card .pill{background:var(--accent);color:#FFFFFF;font-weight:600;font-size:14px;padding:10px 16px;border-radius:12px;white-space:nowrap}
.review-card.done{border:1px solid var(--line);cursor:default}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.week div{display:flex;flex-direction:column;align-items:center;gap:8px}
.week span{width:34px;height:34px;border-radius:16px;background:#EEF1F6}.week span.on{background:var(--accent)}.week span.today{box-shadow:0 0 0 3px var(--accent-tint)}
.week small{font-size:12px;color:var(--muted)}

/* ================= Redesign: the study desk =================
   Squared exercise-book paper, navy pen ink, a highlighter for "today", a teacher's red pen for marking. */
html,body{background-color:var(--bg);color:var(--text);font-family:var(--ui)}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;background-attachment:fixed}
h1,.display,.brand,.verdict,.score,.stepper output,.cover,.bookcover{font-family:var(--ui)}
.brand{font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.muted,.hint{color:var(--muted)}
.card,.tile,.row.card,.review-card,.libcard,.ncard,.mcard,.choice{border-color:var(--line)}
.card{border-radius:16px;box-shadow:0 1px 0 rgba(30,42,90,.04)}
.btn{background:var(--accent);border-radius:16px;font-weight:600;letter-spacing:.005em}
.btn.ghost{background:#FFFFFF;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled,.sheet .btn:disabled{background:#DCE2EE}
.link{color:var(--accent)}
.sheet{border-top:1px solid var(--line);box-shadow:0 8px 24px rgba(30,42,90,.16)}
.chip{background:var(--accent-soft);color:var(--accent-dark)}
.chip.grey{background:#EEF1F6;color:var(--muted)}
.chip.sec{background:var(--ink)}
.seg,.stepper,.ansmode{background:#EEF1FB}
.seg button.on,.ansmode button.on{color:var(--ink)}
textarea,.input,.tinput,.etitle{border-color:#DCE2EE}
textarea:focus,.input:focus,.tinput:focus{border-color:var(--accent)}
.progress{background:#DCE2EE}.progress i{background:var(--accent)}
.bar i{background:var(--good)}.bar.warn i{background:var(--miss)}
.row.picked{background:var(--accent-soft)}
.row .box.on,.point.on .box{background:var(--accent);border-color:var(--accent)}
/* answers: green tick, red pen */
.opt{border-color:var(--line);border-radius:16px}
.opt.picked{border:2px solid var(--accent);background:var(--accent-soft)}
.opt.right{border:2px solid var(--good);background:var(--good-soft)}
.opt.right .dot{background:var(--good);border-color:var(--good)}
.opt.wrong{border:2px solid var(--miss);background:var(--miss-soft)}
.opt.wrong .dot{border-color:var(--miss);color:var(--miss)}
.point.on{background:var(--good-soft);border-color:var(--good)}.point.on .box{background:var(--good);border-color:var(--good)}
.marker{background:var(--miss-soft)}.marker b{color:var(--miss-dark);font-family:var(--hand);font-size:18px}
.marker.full{background:var(--good-soft)}.marker.full b{color:var(--good-dark)}
.tick.full{background:var(--good)}.tick.part{border-color:var(--miss);color:var(--miss)}
/* the teacher's pen: verdicts and scores are written by hand */
.verdict{font-size:22px;font-weight:700;line-height:1.2}
.verdict.ok,.verdict.no{font-family:var(--hand);font-size:28px}
.verdict.ok{color:var(--good-dark)}.verdict.no{color:var(--miss)}
.score{font-family:var(--hand);font-weight:700;font-size:58px;color:var(--miss);display:inline-block;padding:2px 18px 0;border:3px solid var(--miss);border-radius:48% 52% 46% 54%/55% 45% 55% 45%;transform:rotate(-3deg);align-self:flex-start;line-height:1.1}

.btn-sm:hover{background:var(--accent-soft)}

.mstep::after{content:'›';font-size:22px;line-height:1;color:var(--accent);flex:none}
.mstep:hover{background:var(--accent-soft)}
.m-steps{gap:8px}.m-steps li::before{display:none}

   Buttons, chips and tags are rectangles with softly rounded corners: 12px for full-size buttons and text boxes,

/* ---------- Design pass (UI review, 15 Nov 2026) ---------- */
:root{--warn:#B4531A;--warn-soft:#FDF1E7}
/* one main-button colour: navy. Yellow is for highlights and stars only, green for right answers */
.plan-item .go{background:var(--accent);color:#FFFFFF}
.plan-item.done .go{background:var(--good-soft);color:var(--good-dark)}
/* the Learn card on a book page: navy, like the rest of the app */
.learn-card{background:var(--accent-soft);border:1px solid var(--accent-tint)}
.lc-row{border-color:var(--line)}
.lc-up{color:var(--accent);background:var(--accent-tint)}
.lc-go.primary{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.lc-row.done .lc-t small{color:var(--good-dark)}
/* percentages: grey before starting, amber while low, navy, then green. Red only means a wrong answer */
.m-pill{color:var(--warn)}.m-pill.zero{color:var(--muted)}
.bar.warn i{background:var(--warn)}
/* Buddy in the page header on phones (never floating over buttons) */
.ttl-row,.topbar{flex-wrap:nowrap}
.bks-head{flex-wrap:nowrap}
@media (max-width:520px){.hide-sm{display:none}}
/* question screen: the question first, Buddy one tap away */
.tutor-cta{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 10px;border:1px solid var(--accent-tint);border-radius:12px;background:var(--accent-soft);color:var(--ink);font:600 16px var(--ui);cursor:pointer;text-align:left}
.tutor-cta svg{flex:none}.tutor-cta span:not(.tc-go){flex:1}.tutor-cta .tc-go{color:var(--accent);font-size:22px;line-height:1}
.qpaper .q,.qpaper .stemblock .q{color:var(--ink)}
.part .ph.generic{font-size:14px;font-weight:600;color:var(--muted)}
.hint.ahint{margin-top:-10px}
/* results: one main next step, the rest folded */
.rmore{display:flex;flex-direction:column;gap:8px}
.rmore>summary{list-style:none;cursor:pointer;align-self:center;font:600 14px var(--ui);color:var(--accent);padding:8px 12px;border-radius:10px}
.rmore>summary::-webkit-details-marker{display:none}
.rmore>summary::after{content:' ▾'}.rmore[open]>summary::after{content:' ▴'}
.qpaper>.chips{flex-wrap:nowrap;min-width:0}.qpaper>.chips .chip{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qpaper>.chips .say{flex:none;margin-left:auto}
/* first use */
.cs-list{display:flex!important;flex-direction:column;gap:8px}
.cs-item{display:block;padding:0;background:#F4F6FA;border-radius:12px}
.cs-item>summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
.cs-item>summary::-webkit-details-marker{display:none}
.cs-item .cs-ic{flex:none;width:34px;height:34px;border-radius:10px;background:#FFFFFF;color:var(--accent);display:grid;place-items:center;border:1px solid var(--line)}
.cs-item>summary b{flex:1;font-size:16px}
.cs-item .cs-more{color:var(--muted);font-size:22px;line-height:1;transition:transform .15s}
.cs-item[open] .cs-more{transform:rotate(90deg)}
.cs-item>p{margin:0;padding:0 14px 12px 60px}
.pg-conf{z-index:1}.pilotgate .pg-box{position:relative;z-index:2}
/* book covers: light, with the subject colour as the spine, icon and progress bar */
.bookcover.light{background:#FFFFFF;color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 2px rgba(30,42,90,.06);padding-left:20px}
.bookcover.light::before{left:0;width:8px;top:-1px;bottom:-1px;background:var(--cc);border-radius:6px 0 0 6px}
.bookcover.light .c-ic{display:none}.bookcover.light .c-sub{padding-right:0;color:var(--muted);opacity:1;white-space:normal;line-height:1.25;font-weight:600}
.bookcover.light .c-title{color:var(--ink);font-weight:700}
.bookcover.light .c-ch{color:var(--muted);opacity:1}
.bookcover.light .c-meter{background:#EEF1F6}.bookcover.light .c-meter i{background:var(--cc)}
.bookcover.light .c-new{background:var(--accent-soft);color:var(--accent)}
.bookcover.light .c-foot b{color:var(--ink)}
/* Today: the rest is one tap away */
.today-more .ropts{padding:0}
.ropt-i.green{background:var(--good-soft);color:var(--good-dark)}
.coach .coach-cta{display:none}
@media (max-width:1023.98px){.coach.folded>*{display:none}.coach.folded>.coach-cta{display:flex}.coach.folded{background:none;border:none;box-shadow:none;padding:0}}
/* book page: the Up next lesson gets the full width for its title */
.lc-row.next{display:grid;grid-template-columns:1fr auto;column-gap:12px;row-gap:8px;align-items:center}
.lc-row.next .lc-up{grid-column:1/-1;justify-self:start}
/* Practice: Notes and Flashcards are proper tap targets */
.pc-also{gap:8px;margin-top:6px;margin-left:-8px}
.pc-also .linkbtn{font-size:14px;padding:6px 8px;min-height:32px;border-radius:8px;text-decoration:none;color:var(--accent);font-weight:600}
.pc-also .linkbtn:hover{background:var(--accent-soft)}
/* Mistake book: the chapter row opens; Redo is inside */
.mk-list>.mk-redo{display:inline-flex;margin:10px 14px 6px}
.mk-count{background:var(--accent-soft);color:var(--accent)}
/* Settings groups */
.set-h{margin:10px 0 -6px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gs-empty .gs-lead{font-size:14px;color:var(--muted)}
.lc-head h2{color:var(--ink)}.lc-head h2 small{color:var(--accent)}
.ring{--c:var(--warn)}.ring.mid{--c:var(--accent)}.ring.good{--c:var(--good)}
.mk-empty>svg{flex:none;width:64px;height:64px}
.pd-k b.low,.pd-pct.low,.pg-ch b.low,.pg-fc b.low,.pg-tp.low{color:var(--warn)}.pd-bar i.low,.pg-bar.low i{background:var(--warn)}.pg-ring.low .val{stroke:var(--warn)}
/* ---------- design system: components ----------
   Three button types: Primary (filled navy, one per screen), Secondary (outline), Tertiary (text).
   Labels are flat; only things you can tap have a border. One text-box style. One page-title style. */
:root{--muted-2:#5A6380;--field:#8A93AD}
.pagetitle,main h1.pagetitle,.pick-head h1{font-size:28px;font-weight:700;letter-spacing:-.01em;color:var(--ink);line-height:1.2}
.btn{background:var(--accent);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn:disabled,.btn[disabled],.btn-sm:disabled,.btn-sm[disabled]{background:#EEF1F6!important;color:var(--muted)!important;border-color:var(--line)!important;box-shadow:none!important;cursor:not-allowed;opacity:1}
.btn-sm{background:#fff;border:1px solid var(--line);color:var(--accent)}
.btn-sm.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-sm.quiet{background:none;border-color:transparent;color:var(--accent);font-weight:600}
.btn-sm.quiet:hover{background:var(--accent-soft)}
.btn-sm.danger{color:var(--miss-dark);border-color:#F3C4BE;background:#fff}
.chip{background:#EEF1F6;color:var(--text-2);border:none;font-weight:600}
.chip.grey{background:#EEF1F6;color:var(--text-2)}
button.chip{background:#fff;border:1px solid var(--line);color:var(--ink);cursor:pointer}
.input,.tinput,.wr-ta,input.blank-in,select,.searchbox,.searchbox.light{border:1.5px solid var(--field);border-radius:12px;background:#fff}
.input:focus,.tinput:focus,.wr-ta:focus,input.blank-in:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.pc-more,.cs-foot .linkbtn,.cs-agree .linkbtn,p.hint .linkbtn{padding:6px 2px;min-height:28px}
/* contrast: small grey text on white or page grey is at least 4.5:1 */
.tabs button{color:var(--muted)}
@media (max-width:1023.98px){.pg-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}.pg-stat{min-width:0}.pg-stat>*{min-width:0;overflow-wrap:anywhere}
/* Practice → Lessons / Practice questions: one big tappable row per chapter */
.pc-row.big{width:100%;border:none;border-top:1px solid var(--line);background:#fff;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:14px 16px;min-height:64px}
.pc-row.big:first-child{border-top:none}.pc-row.big.next{background:var(--accent-soft)}
.pc-row.big:hover{background:var(--accent-soft)}
.pc-go{flex:none;font:600 14px var(--ui);color:#fff;background:var(--accent);border-radius:10px;padding:9px 14px;white-space:nowrap}
.qtile{position:relative}
.qt-badge{position:absolute;top:12px;right:12px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--miss);color:#fff;font:700 12px var(--ui);display:grid;place-items:center}
.pc-row.big .pc-chev{flex:none;color:var(--muted);font-size:22px;line-height:1}
@keyframes lcflash{from{box-shadow:0 0 0 3px var(--accent)}to{box-shadow:0 0 0 0 transparent}}.lc-row.flash{animation:lcflash .9s ease-out}
.bk-tip{margin:6px 0 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft,#EEF1FB);color:var(--ink);font-size:14px;font-weight:600}
/* Buddy's floating button is special: round, unlike the other buttons */

/* ---- Streak, Duolingo-style: one bold flame + number, joined week days, next badge, a celebration once a day ---- */
.sk-flame{display:inline-flex;flex:none;width:34px;height:42px}
.sk-flame svg{width:100%;height:100%;overflow:visible}
.sk-flame.lit svg{animation:skidle 2.4s ease-in-out infinite;transform-origin:50% 90%;filter:drop-shadow(0 3px 6px rgba(255,120,30,.3))}
.sk-flame.risk svg{animation:skrisk 1s ease-in-out infinite;transform-origin:50% 90%}
@keyframes skidle{0%,100%{transform:scale(1)}50%{transform:scale(1.06,.97)}}
@keyframes skrisk{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg)}40%{transform:rotate(5deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(0)}}
.gr-sk{display:flex;align-items:center;gap:10px}
.gr-sk-n{display:flex;flex-direction:column;line-height:1}
.gr-sk-n b{font-size:30px;font-weight:800;color:#F2661E;letter-spacing:-.01em}
.gr-sk-n b.off{color:#9AA3B5}
.gr-sk-n span{font-size:13px;font-weight:700;color:#8A3A10;margin-top:3px;white-space:nowrap}
.gr-sk-n span.off{color:var(--muted)}
.sk-next{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.sk-next .bar{flex:1 1 auto;max-width:160px;height:8px;border-radius:999px;background:rgba(30,42,90,.10);overflow:hidden}
.sk-next .bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#FFB547,#F2661E)}
.sk-next .medal{flex:none;display:inline-flex}
/* week: done days are orange with a flame, and days in a row join up with a band */
.gr-week i{position:relative}
.gr-week i.on{background:#FF9A2E!important;border-color:#FF9A2E!important;color:#FFFFFF!important;box-shadow:none!important}
.gr-week i.on svg{width:60%!important;height:60%!important}
.gr-week i.today:not(.on){border:2px dashed #FF9A2E!important;color:#F2661E!important}
.today .gr-week{--gap:8px}.gr-week{--gap:4px}
/* celebration (once a day, after the first practice) */
.skc-wrap{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#FFF8EC;animation:skcin .25s ease}
.skc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px;max-width:420px;width:100%}
.skc .big{width:120px;height:150px;animation:skpop .7s cubic-bezier(.3,1.6,.5,1) both}
.skc .big svg{width:100%;height:100%;overflow:visible;animation:skidle 2.4s ease-in-out .7s infinite;transform-origin:50% 90%;filter:drop-shadow(0 8px 18px rgba(255,120,30,.4))}
.skc .num{font-size:72px;font-weight:900;line-height:1;color:#F2661E;font-variant-numeric:tabular-nums}
.skc .lab{font-size:22px;font-weight:800;color:#8A3A10;margin-top:-4px}
.skc p{margin:4px 0 6px;font-size:16px;color:var(--ink);line-height:1.45}
.skc .gr-week{display:flex;gap:10px;--gap:10px;margin:6px 0 10px}
.skc .gr-week i{width:38px;height:38px;font-size:13px}
.skc .btn{min-width:220px}
.skc .sk-next{justify-content:center;width:100%}.skc .sk-next .bar{max-width:200px}
.skc .spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#FFB547;opacity:0;animation:skspark 1.2s ease-out .45s forwards}
@keyframes skpop{0%{transform:scale(.2) translateY(30px);opacity:0}100%{transform:none;opacity:1}}
@keyframes skcin{from{opacity:0}to{opacity:1}}
@keyframes skspark{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
@media (prefers-reduced-motion:reduce){.sk-flame svg,.skc .big,.skc .big svg,.skc .spark{animation:none!important}}
@media (max-width:600px){.sk-flame{width:26px;height:32px}.gr-sk-n b{font-size:22px}.sk-next{display:none}.skc .num{font-size:60px}}

/* ---- Streak flame flicker: bigger and wilder as the streak grows (sk-t1 … sk-t5) ---- */
.sk-flame{position:relative;--amp:1;--dur:1.6s;--glow:6px;--ga:.3}
.sk-flame.lit svg{animation:none!important;filter:drop-shadow(0 0 var(--glow) rgba(255,120,30,var(--ga)))}
.sk-flame.lit .f-o{transform-box:fill-box;transform-origin:50% 100%;animation:fo var(--dur) ease-in-out infinite}
.sk-flame.lit .f-i{transform-box:fill-box;transform-origin:50% 100%;animation:fi calc(var(--dur) * .7) ease-in-out infinite}
.sk-flame.lit svg{animation:fglow calc(var(--dur) * 1.3) ease-in-out infinite!important}
@keyframes fo{0%,100%{transform:scale(1,1) skewX(0)}20%{transform:scale(calc(1 + .03*var(--amp)),calc(1 - .04*var(--amp))) skewX(calc(-2deg*var(--amp)))}40%{transform:scale(calc(1 - .03*var(--amp)),calc(1 + .06*var(--amp))) skewX(calc(2.5deg*var(--amp)))}60%{transform:scale(calc(1 + .02*var(--amp)),calc(1 - .02*var(--amp))) skewX(calc(-1.5deg*var(--amp)))}80%{transform:scale(calc(1 - .02*var(--amp)),calc(1 + .05*var(--amp))) skewX(calc(1.5deg*var(--amp)))}}
@keyframes fi{0%,100%{transform:scale(1,1) translateY(0)}30%{transform:scale(calc(1 - .06*var(--amp)),calc(1 + .1*var(--amp))) translateY(calc(-1px*var(--amp)))}65%{transform:scale(calc(1 + .05*var(--amp)),calc(1 - .06*var(--amp))) translateY(0)}}
@keyframes fglow{0%,100%{filter:drop-shadow(0 0 var(--glow) rgba(255,120,30,var(--ga)))}50%{filter:drop-shadow(0 0 calc(var(--glow) * 1.6) rgba(255,110,20,calc(var(--ga) + .15)))}}
.sk-flame.sk-t1{--amp:.8;--dur:1.8s;--glow:4px;--ga:.25}
.sk-flame.sk-t2{--amp:1.2;--dur:1.5s;--glow:7px;--ga:.35;width:38px;height:47px}
.sk-flame.sk-t3{--amp:1.6;--dur:1.2s;--glow:10px;--ga:.45;width:42px;height:52px}
.sk-flame.sk-t4{--amp:2;--dur:1s;--glow:13px;--ga:.55;width:46px;height:57px}

@keyframes semb{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(calc((var(--x) - 50%) * .3),-130%);opacity:0}}

.skc .big.sk-t1{width:80px!important;height:100px!important}.skc .big.sk-t2{width:92px!important;height:115px!important}.skc .big.sk-t3{width:104px!important;height:130px!important}.skc .big.sk-t4{width:116px!important;height:145px!important}.skc .big.sk-t5{width:128px!important;height:160px!important;--glow:22px}

/* the flame's light warms the card, stronger as the streak grows (only once today's flame is lit) */
.today .gr-hero[class*="glow-"]:not(.glow-0){background:radial-gradient(var(--gw) var(--gh) at 4% 100%,var(--gc),rgba(255,160,60,0) 70%),radial-gradient(120% 160% at 100% 0%,#FFE9A8 0%,rgba(255,233,168,0) 50%),linear-gradient(135deg,var(--b1) 0%,var(--b1) 55%,var(--b2) 100%);border-color:var(--bd)}

.today .gr-hero.glow-2{--gw:60%;--gh:90%;--gc:rgba(255,160,60,.30);--b1:#F2F1F6;--b2:#FFF3DC;--bd:#EED6B6}
.today .gr-hero.glow-3{--gw:80%;--gh:110%;--gc:rgba(255,145,45,.38);--b1:#F8F1EE;--b2:#FFEACB;--bd:#F2C99C}
.today .gr-hero.glow-4{--gw:100%;--gh:130%;--gc:rgba(255,125,35,.45);--b1:#FFF2E6;--b2:#FFDFB3;--bd:#F0B47A}
.today .gr-hero.glow-5{--gw:130%;--gh:160%;--gc:rgba(255,105,25,.52);--b1:#FFEEDC;--b2:#FFD39A;--bd:#EC9D5C}

/* lightbox background warms the same way */

@media (prefers-reduced-motion:reduce){.sk-flame .f-o,.sk-flame .f-i,.sk-flame svg,.sk-emb i,.today .gr-hero.glow-4,.today .gr-hero.glow-5{animation:none!important}.sk-emb{display:none}}
@media (max-width:600px){.sk-flame.sk-t2{width:28px;height:35px}.sk-flame.sk-t3{width:31px;height:39px}.sk-flame.sk-t4{width:34px;height:42px}.sk-flame.sk-t5{width:37px;height:46px}}

/* Flame flicker v2: three layers moving at different speeds so it looks alive, plus a sway; stronger as the streak grows */
.sk-flame.lit .f-all,.sk-flame.lit .f-o,.sk-flame.lit .f-m,.sk-flame.lit .f-i{transform-box:fill-box;transform-origin:50% 100%}
.sk-flame.lit .f-all{animation:fsway calc(var(--dur) * 1.9) ease-in-out infinite}
.sk-flame.lit .f-o{animation:fo2 var(--dur) ease-in-out infinite}
.sk-flame.lit .f-m{animation:fm2 calc(var(--dur) * .73) ease-in-out infinite}
.sk-flame.lit .f-i{animation:fi2 calc(var(--dur) * .53) ease-in-out infinite}
@keyframes fsway{0%,100%{transform:rotate(calc(-3deg*var(--amp)))}50%{transform:rotate(calc(3deg*var(--amp)))}}
@keyframes fo2{0%,100%{transform:scale(1,1) skewX(0)}15%{transform:scale(calc(1 + .05*var(--amp)),calc(1 - .07*var(--amp))) skewX(calc(-5deg*var(--amp)))}35%{transform:scale(calc(1 - .06*var(--amp)),calc(1 + .12*var(--amp))) skewX(calc(4deg*var(--amp)))}55%{transform:scale(calc(1 + .03*var(--amp)),calc(1 - .03*var(--amp))) skewX(calc(-2deg*var(--amp)))}75%{transform:scale(calc(1 - .04*var(--amp)),calc(1 + .09*var(--amp))) skewX(calc(5deg*var(--amp)))}}
@keyframes fm2{0%,100%{transform:scale(1,1) skewX(0);opacity:.9}30%{transform:scale(calc(1 - .07*var(--amp)),calc(1 + .14*var(--amp))) skewX(calc(6deg*var(--amp)));opacity:1}60%{transform:scale(calc(1 + .06*var(--amp)),calc(1 - .08*var(--amp))) skewX(calc(-6deg*var(--amp)));opacity:.75}}
@keyframes fi2{0%,100%{transform:scale(1,1) translateY(0);opacity:1}40%{transform:scale(calc(1 - .1*var(--amp)),calc(1 + .18*var(--amp))) translateY(calc(-1px*var(--amp)));opacity:.85}70%{transform:scale(calc(1 + .08*var(--amp)),calc(1 - .1*var(--amp)));opacity:1}}
/* even with "reduce motion" on, keep a small flicker on the flame itself (no embers, no card pulse) */
@media (prefers-reduced-motion:reduce){.sk-flame.lit .f-o{animation:fo2 var(--dur) ease-in-out infinite!important}.sk-flame.lit .f-m{animation:fm2 calc(var(--dur) * .73) ease-in-out infinite!important}.sk-flame.lit .f-i{animation:fi2 calc(var(--dur) * .53) ease-in-out infinite!important}.sk-flame{--amp:.6!important}}

/* ===== Progress page v2 (pv-): five questions, each card a number + what it means + a button ===== */

.pv-btn{font:600 14px var(--ui,'Lexend',sans-serif);color:var(--accent);background:#FFFFFF;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;text-align:center}

.sc2-lines div>span:nth-child(2){flex:1}.sc2-lines b{color:#7A5200;font-size:15px}.sc2-ic{display:inline-flex;width:28px;height:28px;border-radius:50%;background:#FFE48A;align-items:center;justify-content:center;flex:none}

.sc2-bar{height:10px;border-radius:999px;background:#E6EAF4;overflow:hidden}.sc2-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFC531,#F2A30F);transition:width 1s cubic-bezier(.3,.9,.4,1)}

.part input.blank-in{display:block;width:100%;max-width:420px;min-height:52px;line-height:1.3;padding:12px 14px;font-size:18px;box-sizing:border-box}

/* results: right / partly / missed sit in equal columns, each on one line */

/* answer review: correct answer vs your answer, then steps, then why */
.rfix{background:#FFFFFF!important;border:1.5px solid var(--line)!important;border-radius:14px!important;padding:12px!important;gap:10px!important}

.rfx-dot{flex:none;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;background:#EEF1FB;color:#2F4BB5}
.rfx-steps li.got .rfx-dot{background:var(--good-soft);color:var(--good-dark)}.rfx-steps li.lost .rfx-dot{background:var(--miss-soft);color:var(--miss-dark)}
.rfx-mine2{background:#F6F7FB;border-radius:10px;padding:8px 10px;font-size:14px}
.rfx-why2{display:flex;gap:8px;align-items:flex-start;background:#FFF8E1;border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.5;color:var(--ink)}.rfx-bulb{flex:none}
@media (max-width:340px){.rfx-pair{grid-template-columns:1fr}.rrow>.rfix{margin-left:0!important;flex-basis:100%!important}}
/* Buddy suggests: big readiness ring, then the next step */
.rsg-ready{display:flex;align-items:center;gap:14px;background:#FFFFFF;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}

.sc2-top{flex:none}.sc2-big{justify-content:center}

.sc2-chg{flex:none;align-self:center}
.sc2-pick{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left}.sc2-pick small{font-size:13px;font-weight:700;color:var(--ink);text-align:center}
.sc2-pick>div{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;max-height:200px;overflow:auto}

/* while the app starts: blank for the first moment (most loads finish here), then Buddy bounces in with twinkling stars */
.boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;opacity:0;animation:bootin .35s ease .7s forwards;background:#F4F6FB}
.boot-stage{position:relative;width:160px;height:150px;display:flex;align-items:flex-end;justify-content:center}
.boot-bud{position:relative;z-index:2;animation:bootjump .9s cubic-bezier(.3,.0,.4,1) infinite}
.boot-bud svg{display:block;width:96px;height:96px}
.boot-shadow{position:absolute;bottom:-6px;left:50%;width:64px;height:10px;margin-left:-32px;border-radius:50%;background:rgba(30,42,90,.12);animation:bootshadow .9s cubic-bezier(.3,.0,.4,1) infinite}
.boot-star{position:absolute;font-size:22px;color:#FFC531;animation:boottw 1.6s ease-in-out infinite}
.boot-star.s1{left:6px;top:28px}.boot-star.s2{right:4px;top:10px;font-size:28px;animation-delay:.5s}.boot-star.s3{right:22px;top:78px;font-size:16px;animation-delay:1s}
.boot-msg{position:relative;height:22px;width:260px;margin:0;text-align:center;font:600 15px/22px Inter,system-ui,sans-serif;color:#5A6587}
.boot-msg span{position:absolute;inset:0;opacity:0;animation:bootmsg 4.8s linear infinite}
.boot-msg span:nth-child(2){animation-delay:1.2s}.boot-msg span:nth-child(3){animation-delay:2.4s}.boot-msg span:nth-child(4){animation-delay:3.6s}
@keyframes bootin{to{opacity:1}}
@keyframes bootjump{0%,100%{transform:translateY(0) scale(1.06,.94)}15%{transform:translateY(0) scale(1)}50%{transform:translateY(-38px) scale(.97,1.03) rotate(-4deg)}85%{transform:translateY(0) scale(1)}}
@keyframes bootshadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.55);opacity:.5}}
@keyframes boottw{0%,100%{transform:scale(.6) rotate(0);opacity:.3}50%{transform:scale(1.15) rotate(20deg);opacity:1}}
@keyframes bootmsg{0%{opacity:0;transform:translateY(6px)}5%,22%{opacity:1;transform:none}27%,100%{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.boot-bud,.boot-shadow,.boot-star{animation-duration:2.4s}}

.pv-aim{position:absolute;left:0;right:0;top:50%;width:100%;height:28px;margin:-14px 0 0;background:transparent;-webkit-appearance:none;appearance:none;cursor:ew-resize;z-index:3}

.gd2-h{display:flex;align-items:center;gap:12px}.gd2-h>div{flex:1;display:flex;flex-direction:column;gap:2px}.gd2-h b{font-family:'Lexend',sans-serif;font-size:20px;color:var(--ink)}.gd2-h small{font-size:13.5px;color:var(--text-2)}

.gd2-days button.on{background:var(--accent);border-color:var(--accent);color:#FFFFFF;transform:scale(1.08)}
.gd2-mins{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gd2-mins button{border-radius:12px;border:2px solid var(--line);background:#FFFFFF;font:inherit;cursor:pointer;padding:8px 0;display:flex;flex-direction:column;align-items:center;color:var(--ink)}
.gd2-mins b{font-family:'Lexend',sans-serif;font-size:17px}.gd2-mins small{font-size:11px;color:var(--text-2)}
.gd2-mins button.on{background:var(--accent);border-color:var(--accent);color:#FFFFFF}.gd2-mins button.on small{color:rgba(255,255,255,.8)}
.gd2-sum{display:flex;align-items:center;gap:12px;background:#FFF8E1;border:1.5px solid #FBE7A6;border-radius:14px;padding:12px 14px}.gd2-sum>span{font-size:26px}.gd2-sum div{display:flex;flex-direction:column;gap:2px}.gd2-sum b{font-size:15px;color:var(--ink)}.gd2-sum small{font-size:13px;color:#7A5200}
.gd2-exam summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--accent);list-style:none;display:flex;align-items:center;gap:6px}.gd2-exam summary::before{content:'+';font-size:18px;line-height:1}.gd2-exam[open] summary::before{content:'–'}
.gd2-exam summary::-webkit-details-marker{display:none}.gd2-exam[open]{display:flex;flex-direction:column;gap:8px}.gd2-exam .input{margin-top:8px;min-height:44px}
.gd2 .rd-row{margin-top:2px}.gd2-rm{align-self:center;background:none;border:0;font:inherit;font-size:13.5px;color:var(--text-2);text-decoration:underline;cursor:pointer}
@media (max-width:380px){.gd2-mins{grid-template-columns:repeat(3,1fr)}}

/* info pop-ups: a comfortable reading width on desktop too */

/* info pop-up rows v2: icon in a soft circle, a bold line with its detail tight underneath, thin dividers instead of boxes */

.how-easy li{background:none!important;border-radius:0!important;padding:12px 0!important;border-top:1px solid var(--line);align-items:flex-start!important;gap:14px!important}

/* glance card v3 (option B): the verdict and a short summary on top, then six equal tiles — the two notes are tiles too */

.pv-sum .pv-sum-row.g{grid-area:g}.pv-sum .pv-sum-row.w{grid-area:w}
.pv-sum .k-ring{grid-area:r}.pv-sum .k-book{grid-area:b}.pv-sum .k-brain{grid-area:m}.pv-sum .k-cal{grid-area:d}
.pv-sum .pv-sum-row{flex-direction:column!important;align-items:flex-start!important;justify-content:flex-start;gap:8px!important;padding:14px 16px!important;border-radius:16px!important;min-height:0!important;position:relative}
.pv-sum .pv-sum-row.g{background:#E8F7EF!important;border:1px solid #BFE6D1!important}.pv-sum .pv-sum-row.w{background:#FFF6DC!important;border:1px solid #F3DE9A!important}
.pv-sum .pv-sum-row>span{gap:4px!important}.pv-sum .pv-sum-row small{font-size:13px!important;font-weight:700!important}
.pv-sum .pv-sum-row.g small{color:var(--good-dark)!important}.pv-sum .pv-sum-row.w small{color:#8A6A00!important}
.pv-sum .pv-sum-row b{font-family:'Lexend',sans-serif;font-size:17px!important;line-height:1.35!important}
.pv-sum .pv-sum-row i{width:34px!important;height:34px!important}.pv-sum .pv-sum-row.g i{background:#FFFFFF!important}.pv-sum .pv-sum-row.w i{background:#FFFFFF!important}

@media (max-width:700px){.pv-sum{grid-template-columns:repeat(2,minmax(0,1fr))!important;grid-template-areas:'h h' 'g w' 'r b' 'm d'}}

@media (max-width:700px){.pv-sum .pv-sum-row b{font-size:15px!important}.pv-sum .pv-sum-row{padding:12px!important}.pv-sum-h{padding:14px!important;align-items:flex-start!important}.pv-sum-h svg{width:40px;height:40px}.pv-sum-h b{font-size:17px!important}.pv-sum-h span{font-size:14px}}
