<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<title>PrepBuddy admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1E2A5A;--text-2:#3F4868;--muted:#5A6380;--line:#DCE2EE;--bg:#F4F6FA;--grid:#E3E8F1;--accent:#26357A;--accent-soft:#EEF1FB;--good:#18966A;--good-soft:#E5F5EE;--miss:#D93A2B;--miss-soft:#FDEEEC;--hl:#FFE066;
  --ui:'Lexend',system-ui,-apple-system,'PingFang HK','Microsoft JhengHei','Noto Sans TC',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui)}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:1480px;margin:0 auto;padding:28px clamp(16px,3vw,40px) 80px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-size:24px}h2{margin:0;font-size:18px}h3{margin:0;font-size:15px}
.badge{font-size:12px;font-weight:600;background:var(--hl);border-radius:999px;padding:3px 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}.hint{font-size:13px;color:var(--muted);line-height:1.5}
.btn{border:none;border-radius:12px;background:var(--accent);color:#fff;font:600 15px var(--ui);padding:12px 18px;cursor:pointer}
.btn:disabled{background:#B7BDD0;cursor:default}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--miss)}
.link{display:inline-flex;align-items:center;justify-content:center;min-height:34px;background:#fff;border:1.5px solid #D6DCF3;border-radius:999px;color:var(--accent);font:600 13.5px var(--ui);cursor:pointer;padding:5px 14px}
.link:hover{background:var(--accent-soft)}
.link.red{color:#B22A1E;border-color:#F3C4BE}.link.red:hover{background:var(--miss-soft)}
input,select,textarea{font:15px var(--ui);color:var(--ink);border:1.5px solid #CDD4E3;border-radius:10px;padding:10px 12px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:600;color:var(--text-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid #EEF1F6}
.row:first-child{border-top:none}
.row .meta{display:flex;flex-direction:column;gap:3px;min-width:0}.row .meta span{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:14px;flex-wrap:wrap}
.chap{border-top:1px solid #EEF1F6;padding:12px 0;display:flex;flex-direction:column;gap:8px}
.chap:first-child{border-top:none}
.chap .top{display:flex;gap:10px;align-items:center}
.chap .num{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;font-size:13px;font-weight:600}
.chap .pp{flex:none;font-size:12.5px;color:var(--muted);white-space:nowrap}
.chap details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.chap pre{white-space:pre-wrap;font:13px/1.5 var(--ui);color:var(--text-2);background:#F7F8FB;border-radius:10px;padding:10px;max-height:180px;overflow:auto;margin:6px 0 0}
.split{background:var(--accent-soft);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.split select{width:auto;flex:1;min-width:200px}
.progress{height:8px;border-radius:4px;background:#E3E7F1;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.ok{background:var(--good-soft);color:#0E6E4D;border-radius:12px;padding:12px 14px;font-weight:600}
.err{background:var(--miss-soft);color:#B22A1E;border-radius:12px;padding:12px 14px;font-weight:600}
.steps{display:flex;gap:8px;flex-wrap:wrap}.steps span{font-size:13px;padding:5px 12px;border-radius:999px;background:#E9ECF4;color:var(--muted)}
.steps span.on{background:var(--ink);color:#fff}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:500}.check input{width:auto;margin-top:3px}
.btn.small{font-size:13.5px;padding:8px 14px;border-radius:10px}
.verdicts{gap:10px;margin-top:4px}
.rstats{margin:0;font-size:13.5px;color:var(--text-2);background:#F7F8FB;border-radius:10px;padding:8px 12px}
.rep{border-top:1px solid #EEF1F6;padding:12px 0;display:flex;flex-direction:column;gap:6px}
.rep-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rtag{font-size:13px;font-weight:600;background:var(--miss-soft);color:#B22A1E;border-radius:999px;padding:3px 10px}
.rnote{margin:0;font-size:14px;line-height:1.5;background:#FFF6CC;border-radius:10px;padding:8px 10px}
.rep details summary{cursor:pointer;font-size:13px;color:var(--accent);font-weight:600}
.rq{background:#F7F8FB;border-radius:10px;padding:10px 12px;margin-top:6px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5}
.rq p{margin:0}.ropts{margin:0;padding-left:22px}.ropts li.right{color:#0E6E4D;font-weight:600}.rq-ms{margin:0;padding-left:20px;color:var(--text-2)}
.aifill{background:#FFF8E1;border:1px solid #F4D27A;border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.5}
.pl-entry{flex-direction:row;align-items:center;justify-content:space-between}.pl-entry div{display:flex;flex-direction:column;gap:4px}
.pl-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media (min-width:760px){.pl-tiles{grid-template-columns:repeat(6,1fr)}}@media (min-width:1280px){.pl-tiles{grid-template-columns:repeat(12,1fr)}.pl-tiles b{font-size:21px}}
.pl-tiles div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}.pl-tiles b{font-size:24px}.pl-tiles span{font-size:12.5px;color:var(--muted)}
.pl-tablewrap{overflow-x:auto}.pl-table{width:100%;border-collapse:collapse;font-size:14px;min-width:680px}
.pl-table th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}.pl-table th small{font-weight:400}
.pl-table td{padding:10px 8px;border-bottom:1px solid #EEF1F6;vertical-align:top}.pl-table td small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.pl-row{cursor:pointer}.pl-row:hover,.pl-row.open{background:#F7F8FB}.pl-row.cold{opacity:.55}.pl-row.never td{color:var(--muted)}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:#EEF1F6}.tag.red{background:var(--miss-soft);color:#B22A1E}
.pl-detail td{background:#FAFBFD}.fd{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;padding:6px 2px}@media (max-width:760px){.fd{grid-template-columns:1fr}}@media (min-width:1200px){.fd{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fd h3{font-size:13.5px;margin:0 0 6px}.fd-bars{display:flex;gap:3px;align-items:flex-end;height:74px;border-bottom:1px solid var(--line)}.fd-bars span{flex:1;display:flex;align-items:flex-end;height:100%}.fd-bars i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0}.fd-bars i.none{background:#E3E7F1}
.fd-row{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:3px 0;border-bottom:1px dashed #EEF1F6}.fd-row small{color:var(--muted);font-weight:400}
.fd-err{font-size:12.5px;color:#B22A1E;background:var(--miss-soft);border-radius:8px;padding:5px 8px;margin-bottom:4px}.fd-err small{color:var(--muted)}
.fd-fb{font-size:13.5px;margin:0 0 6px;line-height:1.5}.fd-fb small{color:var(--muted)}
.pl-add>summary{list-style:none;cursor:pointer}.pl-add>summary::-webkit-details-marker{display:none}.pl-add>summary h2{margin:0;display:inline}.pl-add[open]>summary{margin-bottom:12px}
.pl-close{display:none}.fd>div:nth-child(5){order:-2}.fd>div:nth-child(1){order:-1}
@media (max-width:720px){
  .pl-tiles{grid-template-columns:repeat(2,1fr)!important;gap:8px}.pl-tiles div{padding:10px 12px}.pl-tiles b{font-size:21px}
  .pl-tablewrap{overflow:visible}.pl-table{min-width:0;display:block}.pl-table thead{display:none}.pl-table tbody{display:flex;flex-direction:column;gap:10px}
  .pl-table tr.pl-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
  .pl-table tr.pl-row.open{border-color:var(--accent);border-bottom-left-radius:0;border-bottom-right-radius:0}
  .pl-table tr.pl-row td{display:block;padding:0;border:0}
  .pl-table td.c-name{grid-column:1/3}.pl-table td.c-last{grid-column:3;text-align:right;font-size:13px;color:var(--muted)}.pl-table td.c-last::before{display:none}
  .pl-table td[data-l]::before{content:attr(data-l);display:block;font-size:11px;color:var(--muted);margin-bottom:1px}
  .pl-table td.c-plan{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pl-table td.c-plan::before{margin:0}
  .pl-table tr.pl-detail{display:block;margin-top:-10px}.pl-table tr.pl-detail[hidden]{display:none}.pl-table tr.pl-detail td{display:block;border:1px solid var(--accent);border-top:0;border-radius:0 0 14px 14px;padding:12px}
  .pl-close{display:block;margin:0 0 6px auto;font-size:13px}
  .fd{gap:14px}.pl-kv{grid-template-columns:1fr}
  .pl-feats div{grid-template-columns:minmax(0,1fr) auto}.pl-feats i{display:none}
  .card h2{font-size:17px}
  .pl-table tr,.pl-table td{box-sizing:border-box;max-width:100%}
  .fd-row{flex-wrap:wrap;gap:2px 10px;padding:6px 0}.fd-row>span{flex:1 1 auto}.fd-row>b{text-align:right;margin-left:auto}.fd h3{font-size:14.5px;margin-top:6px}
  .wrap>header{flex-wrap:wrap;gap:8px}.pl-acts .hint{width:100%}.pl-tablewrap{margin:0 -6px}
}
.pl-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pl-tiles div small{font-size:11.5px}.pl-tiles small.up{color:#1F8A4C}.pl-tiles small.down{color:#B22A1E}
.pl-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}@media (max-width:860px){.pl-grid{grid-template-columns:minmax(0,1fr)}}.pl-grid>.card{min-width:0}.pl-grid>.card{margin:0}
.pl-h3{font-size:13.5px;margin:12px 0 6px}
.pl-kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px}.pl-kv div{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:4px 0;border-bottom:1px dashed #EEF1F6}.pl-kv span{color:var(--muted)}@media (max-width:520px){.pl-kv{grid-template-columns:1fr}}
.pl-mini{min-width:0}.pl-mini td,.pl-mini th{padding:6px 8px}
.pl-cols{display:flex;gap:2px;align-items:flex-end;height:96px}.pl-cols span{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:3px}.pl-cols i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0}.pl-cols i.none{background:#E6EAF1}.pl-cols small{font-size:10.5px;color:var(--muted);height:13px}
.hm{display:flex;flex-direction:column;gap:3px;overflow-x:auto}.hm-row{display:grid;grid-template-columns:150px repeat(28,minmax(12px,1fr));gap:3px;align-items:center;min-width:560px}.hm-row>span{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-row i{display:block;height:16px;border-radius:3px;background:#EEF1F6}.hm-row i.l1{background:#CFE0FF}.hm-row i.l2{background:#94B8FF}.hm-row i.l3{background:#5A8DF5}.hm-row i.l4{background:#2D5FD3}.hm-key small{font-size:10.5px;color:var(--muted);white-space:nowrap}
.pl-table td:first-child{min-width:170px}.pl-sec{font-size:18px;margin:10px 0 -4px}.pl-plan{font:inherit;font-size:13px;padding:4px 6px;min-width:112px;width:auto;max-width:160px;border-radius:8px;border:1px solid var(--line);background:#fff}.pl-saved{display:block;color:#1F8A4C;font-size:11.5px;margin-top:3px}
.pl-feats{display:flex;flex-direction:column;gap:6px}.pl-feats div{display:grid;grid-template-columns:minmax(130px,1.1fr) 1fr minmax(110px,auto);gap:10px;align-items:center;font-size:13.5px}.pl-feats i{display:block;height:10px;border-radius:5px;background:var(--accent)}.pl-feats b{font-size:12.5px;font-weight:600;color:var(--text-2)}
@media (max-width:640px){.pl-feats div{grid-template-columns:minmax(0,1fr) auto}.pl-feats i{display:none}}
.pl-fb{border-top:1px solid #EEF1F6;padding:10px 0}.pl-fb:first-of-type{border-top:none}.pl-fb small{color:var(--muted)}.pl-fb p{margin:4px 0 0;line-height:1.5}
:focus-visible{outline:3px solid #1D4ED8;outline-offset:2px}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<script type="module" src="js/admin.js"></script>
</body>
</html>
